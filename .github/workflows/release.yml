# Release of the engine (upstream only, repository variable OPENBRAIN_UPSTREAM=true): push a tag vX.Y.Z,
# the checks run, then a GitHub release is published. Its source archive is what `openbrain upgrade` installs.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: vars.OPENBRAIN_UPSTREAM == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Checks
        run: |
          npm run typecheck
          npm test
          npm run openbrain -- lint --root examples/acme
          npm run openbrain -- guide check --root examples/acme
          npm run openbrain -- eval --no-llm --root examples/acme
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
