# Routing registry of the Acme brain.
# Maintained by the weekly update (and by hand when needed), never generated: knowledge/ is a mirror of
# Notion, this file says WHEN the agent should open each page. One entry per page holding knowledge, one per
# section. No content here (no figures, no dates): the content lives in Notion.
version: 1
sections:
  admin:
    description: "Acme Console, the back-office where Acme staff set up client companies, groups, client users, SLA policies and SSO."
    rules:
      - 'A "user" here is a client end user (an agent of a client company), never a colleague: giving a colleague access is internal-tools/accounts.'
      - When the question is about what can be chosen on a group, also open the company settings (parent level).
      - "What a company can allow is itself capped by its plan: also open product/plans-and-features."
      - "Setting up a new client: the runbook gives the order, the screen docs give the fields, sales/account-roles-and-handover gives who does what."
  internal-tools:
    description: "Acme Hub (pipeline, client health, reports) and Acme Billing (billing accounts, invoices, credit notes): access and daily use."
    rules:
      - A "user" or an "account" in Acme Hub is an Acme employee using the tool, never a client.
      - 'In Acme Billing, a "billing account" is the billing record of a client company; a colleague with access is a "member".'
      - Reports here are internal figures about Acme, never the reports clients see in Acme Desk.
  legal-security:
    description: "GDPR roles, DPAs, subprocessors, certifications, security rules for employees, security incidents, data subject requests."
    rules:
      - For an answer given to a client, these pages are the reference; sales/security-questionnaire gives the ready-made wording.
      - "A security incident (data or access at risk) is handled here; an outage or a broken feature is support-ops."
  people:
    description: "HR policies for Acme employees, with no personal data: leave, remote work, expenses, travel, equipment, first week."
    rules:
      - If a topic is not documented here, say so and point to people/hr-contacts. Never answer HR questions from general knowledge.
  product:
    description: "How the client-facing helpdesk app works: plans, roles, channels, SLAs, inbox, reports, login, API, data retention and export."
    rules:
      - A "user" in this section is an agent or supervisor of a client working in Acme Desk, never an Acme employee.
      - "The channels a client group can use are capped by the channels allowed for its company: also open admin/companies."
      - "An SLA here is a target a client sets for its own customers, never the uptime commitment of Acme (support-ops/uptime-commitment)."
  sales:
    description: "Pricing, sales process, trials, proposals, renewals, who does what on an account, answers to security questionnaires."
    rules:
      - A price marked to_confirm must be presented as not confirmed yet.
      - For data retention or security answers given to a client, product/data-retention is the reference page.
      - 'An "account plan" is a sales document about a client; a "plan" alone is an Acme Desk subscription plan.'
  support-ops:
    description: "How Acme's own support team works: levels, escalation, on-call, incidents, uptime commitment, refunds and credits."
    rules:
      - These pages describe the support Acme gives its clients, not the helpdesk features of Acme Desk.
      - "Support hours, response targets and the uptime commitment here are Acme's own, never the settings of a client group."
