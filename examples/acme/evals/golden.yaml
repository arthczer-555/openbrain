# Golden questions for the Acme example.
# behavior: answer | not_documented | clarify | refuse
# must_include facts appear verbatim in a cited page (numbers, field names), so a good answer can quote them,
# in English or in French. Traps covered: same word with two meanings (user, account,
# plan, SLA), a child setting capped by its parent, a procedure spread over three pages, information absent,
# to_confirm and stale pages, warnings to apply, French questions, out of scope.

- id: scope-beats-keyword-01
  question: "How do I add a user in the internal tool?"
  lang: en
  expect:
    behavior: answer
    must_cite: ["internal-tools/accounts"]
    must_not_cite: ["admin/users"]
    must_include: ["Add teammate"]
    must_not_include: ["CSV"]
  tags: [routing, trap, same-word]

- id: scope-beats-keyword-02-fr
  question: "Comment ajouter un utilisateur dans l'outil interne ?"
  lang: fr
  expect:
    behavior: answer
    must_cite: ["internal-tools/accounts"]
    must_not_cite: ["admin/users"]
  tags: [routing, trap, same-word, multilingual]

- id: client-user-01
  question: "How do I import client users from a CSV file?"
  lang: en
  expect:
    behavior: answer
    must_cite: ["admin/users"]
    must_include: ["Import CSV"]
  tags: [routing]

- id: parent-level-01
  question: "Why can't I enable live chat on a client group?"
  lang: en
