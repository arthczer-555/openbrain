# Same word, two meanings: "account" (Hub login, Billing member, billing account), "plan", "SLA".

- id: account-trap-01
  question: "How do I give a colleague access to Acme Billing?"
  lang: en
  expect:
    behavior: answer
    must_cite: ["internal-tools/billing-overview"]
    must_not_cite: ["internal-tools/accounts", "internal-tools/billing-accounts"]
    must_include: ["Invite member"]
    must_not_include: ["Add teammate"]
  tags: [routing, trap, same-word, warning]

