<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>OpenBrain: clone, connect, deploy. Your docs answer back.</title>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <g transform="translate(80 80) scale(2)">
    <rect width="30" height="30" rx="6" fill="#111114"/>
    <path d="M8 10l5 5-5 5" stroke="#F00050" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 20h7" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text x="160" y="124" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="36" font-weight="700" fill="#111114">openbrain</text>
  <text x="80" y="300" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="68" font-weight="800" letter-spacing="-2.7" fill="#111114">Clone. Connect. Deploy.</text>
  <text x="80" y="380" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="68" font-weight="800" letter-spacing="-2.7" fill="#111114">Your docs answer back<tspan fill="#F00050">_</tspan></text>
  <text x="80" y="470" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="28" fill="#4A4A55">Notion as the single source of truth. A cited chatbot that improves every week.</text>
  <text x="80" y="560" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" fill="#5A5A64">open source, MIT licensed</text>
  <rect x="0" y="618" width="1200" height="12" fill="#F00050"/>
</svg>
